name: androidBuild

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: LinuxAddic
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev libvlccore-dev libvlccore9

      - name: Android SDK + NDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          mkdir -p "$ANDROID_HOME"
          curl -sSL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          rm -rf /tmp/clt && mkdir -p /tmp/clt
          unzip -q /tmp/clt.zip -d /tmp/clt
          SDKMGR="/tmp/clt/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0" "ndk;29.0.13113456" "platforms;android-29" "platforms;android-35"

      - name: Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: hmm
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install

      - name: lime configs
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/29.0.13113456"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: build apk
        run: haxelib run lime build android -release -DEXCLUDE_ARMV7

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-APK
          path: |
            export/**/outputs/apk/**/*.apk
            Export/**/outputs/apk/**/*.apk
          if-no-files-found: error
