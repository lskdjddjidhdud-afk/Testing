name: androidBuild

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android sdk
        uses: android-actions/setup-android@v3

      - name: ndks
        run: sdkmanager --install "build-tools;35.0.0" "ndk;29.0.13113456" "platforms;android-29" "platforms;android-35"

      - name: Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: hmm
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install

      - name: line configs
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/29.0.13113456
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: build apk
        run: haxelib run lime build android -release -arm64

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-APK
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
